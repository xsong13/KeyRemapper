name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: cargo +stable test --locked
      - name: Build release
        run: cargo +stable build --release --locked
      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: KeyRemapper-windows-x64
          path: target/release/keyremapper.exe
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KeyRemapper-windows-x64
      - name: Publish Windows executable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "KeyRemapper $TAG" --generate-notes
          fi
          gh release upload "$TAG" keyremapper.exe --clobber
          gh release edit "$TAG" --draft=false
