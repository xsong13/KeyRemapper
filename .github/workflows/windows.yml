name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: cargo +stable test --locked
      - name: Build release
        run: cargo +stable build --release --locked
      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: KeyRemapper-windows-x64
          path: target/release/keyremapper.exe
          if-no-files-found: error
